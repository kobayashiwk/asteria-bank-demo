<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Asteria Bank</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header><h1>Asteria Bank</h1><label>利用者 <select id="actor"><option value="1">Alice</option><option value="2">Bob</option><option value="99">Operations</option></select></label></header>
  <main>
    <section><h2>口座</h2><div id="accounts"></div></section>
    <section><h2>振込</h2><form id="transfer"><input name="fromAccount" placeholder="振込元口座" required><input name="toAccount" placeholder="振込先口座" value="2001" required><input name="amount" type="number" min="1" placeholder="金額" required><input name="memo" placeholder="メモ"><button>実行</button></form></section>
    <section><h2>キャンペーン</h2><form id="promotion"><input name="code" value="WELCOME500" required><button>適用</button></form></section>
    <section><h2>メッセージ確認</h2><form id="preview"><textarea name="message" placeholder="メッセージ"></textarea><button>確認</button></form><pre id="messagePreview"></pre></section>
    <section><h2>お客様検索</h2><form id="search"><input name="q" placeholder="氏名"><button>検索</button></form><pre id="searchResult"></pre></section>
    <p id="notice" role="status"></p>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
